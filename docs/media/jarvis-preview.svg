<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">J.A.R.V.I.S. desktop interface preview</title>
  <desc id="desc">Illustrative preview of the dark J.A.R.V.I.S. Windows desktop app, with navigation, chat, local AI status, and a message composer.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#101a2b"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#e36b35"/><stop offset="1" stop-color="#f2b84b"/></linearGradient>
    <linearGradient id="assistant" x2="1" y2="1"><stop stop-color="#132238"/><stop offset="1" stop-color="#102a3b"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="11" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#070a10"/>
  <rect x="12" y="12" width="1416" height="876" rx="22" fill="url(#background)" stroke="#243247" stroke-width="2"/>
